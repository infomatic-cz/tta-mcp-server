# Include this file from inside nginx.conf's http { } block.
# Replace the example hostname with the certificate's DNS SAN and the client URL.

log_format tta_safe '$remote_addr [$time_iso8601] $request_method $uri $server_protocol $status $body_bytes_sent $request_time';

server_tokens off;

# Reject clients that do not send the expected SNI hostname.
server {
    listen 0.0.0.0:8543 ssl default_server;
    listen [::]:8543 ssl default_server;
    ssl_reject_handshake on;
}

server {
    listen 0.0.0.0:8543 ssl;
    listen [::]:8543 ssl;
    server_name tta-mcp.example.local;

    ssl_certificate     C:/Apps/Certificates/server-fullchain.pem;
    ssl_certificate_key C:/Apps/Certificates/server-encrypted.key;
    # The broker serves this only through a current-user-only Windows named pipe.
    ssl_password_file   //./pipe/TTAMCPNginxPassphrase;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TTAMCPSSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;
    ssl_early_data off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    access_log logs/tta-mcp-access.log tta_safe;
    error_log  logs/tta-mcp-error.log warn;

    client_max_body_size 1m;
    client_body_timeout 15s;

    location / {
        proxy_pass http://127.0.0.1:8380;
        proxy_http_version 1.1;
        proxy_set_header Host              $http_host;
        proxy_set_header Connection        "";
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Host  $http_host;
        proxy_set_header X-Forwarded-Proto https;

        # MCP Streamable HTTP/SSE must not be buffered or cached by the proxy.
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 5m;
        proxy_connect_timeout 10s;
        proxy_next_upstream off;
    }
}
